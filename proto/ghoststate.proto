syntax = "proto3";

package ghostd;

option go_package = "github.com/xaiki/ghostd/proto";

// HostState is ghostd's whole RPC surface (README.md): the
// daemon does not decide policy, it executes a state the caller already
// resolved. GetState answers with clean, diffable current state; Apply
// enacts a fully-resolved declarative target behind a dead-man's-switch;
// Confirm — called from a *fresh* connection, after independently
// reproving reachability — cancels that switch. No Confirm before the
// deadline restores the pre-apply snapshot.
service HostState {
  rpc GetState(GetStateRequest) returns (State);
  rpc Apply(ApplyRequest) returns (ApplyResponse);
  rpc Confirm(ConfirmRequest) returns (ConfirmResponse);
  // Registry reads are separate so ordinary firewall observations stay small.
  rpc GetRegistry(RegistryRequest) returns (RegistryResponse);
  rpc ImportLeases(RegistryDocument) returns (RegistryResponse);
  rpc ReportHost(RegistryDocument) returns (RegistryResponse);
  rpc RepairIdentity(RegistryDocument) returns (RegistryResponse);
  rpc DHCPHandover(RegistryDocument) returns (RegistryResponse);
}

message RegistryRequest {
  string scope = 1;
  string address = 2;
  int64 at_unix = 3;
  uint64 after_event = 4;
  uint32 event_limit = 5;
}
message RegistryDocument { string json = 1; }
message RegistryResponse { string json = 1; }

message GetStateRequest {
  // Optional fixed read-only adoption evidence; ordinary state reads stay lightweight.
  bool include_adoption_evidence = 1;
}

// State is deliberately a thin envelope around raw, structured JSON per
// domain rather than a typed nftables/netconfig schema in proto itself:
// each domain's real shape is still being designed (Phase 4/5), and the
// envelope is what lets GetState/Apply exist now without churning the
// wire format every time a domain's internals change.
message State {
  // `nft -j list ruleset` output, verbatim.
  string nft_ruleset_json = 1;
  // The caller's own live-read shape for interface configuration (persisted
  // interfaces.d file bytes + `ip -j addr show` + /proc/sys/net/ipv4/ip_forward),
  // as JSON.
  string netconfig_json = 2;
  string adoption_evidence_json = 3;
  string dhcp_config_json = 4;
}

message ApplyRequest {
  // The fully-resolved declarative target the caller computed — not a diff.
  string desired_state_json = 1;
  // How long the dead-man's-switch waits for Confirm before reverting to
  // the pre-apply snapshot. Required; the caller does not get to apply
  // with no revert path.
  int32 dead_man_switch_seconds = 2;
  // Which domain desired_state_json is for: "firewall" or "netconfig".
  // Required — the two domains' desired_state_json shapes are incompatible,
  // and routing one to the wrong renderer on a guess is not a survivable
  // mistake to auto-detect.
  string domain = 3;
}

message ApplyResponse {
  string lease_id = 1;
}

message ConfirmRequest {
  string lease_id = 1;
}

message ConfirmResponse {
  bool ok = 1;
}
